[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "products-rag-core"
version = "1.0.0"
requires-python = ">=3.12"
description = "Small explicit RAG, identity and persistence helpers for the workshop"

[tool.setuptools.packages.find]
where = ["."]
include = ["rag_core*"]
