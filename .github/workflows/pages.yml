name: Publiser AI-200

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Hent kildefilene
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Sett opp Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Kontroller bygg og opprydding
        run: python -m unittest discover -s tests -p test_build.py -v

      - name: Bygg nettstedet og tøm midlertidige filer
        run: python scripts/build.py

      - name: Kontroller felles meny og egne innholdssider
        run: |
          python -m unittest discover -s tests -p test_navigation.py -v
          node --test tests/site.test.cjs tests/learning-objectives.test.cjs

      - name: Kontroller workshopfiler og tilbakestilling
        run: python -m unittest discover -s tests -p test_workshop_docs.py -v

      - name: Kontroller flashcards og kategorier
        run: python -m unittest discover -s tests -p test_flashcards.py -v

      - name: Kontroller begreper og eksempler
        run: python -m unittest discover -s tests -p test_jargon.py -v

      - name: Kontroller workshops og kortdekning
        run: python -m unittest discover -s tests -p test_new_workshops.py -v

      - name: Kontroller prøveeksamen og spørsmålsbank
        run: |
          python -m unittest discover -s tests -p test_practice_exam.py -v
          node --test tests/practice-exam.test.cjs

      - name: Klargjør GitHub Pages
        uses: actions/configure-pages@v5

      - name: Last opp nettstedet
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Publiser nettstedet
        id: deployment
        uses: actions/deploy-pages@v5
