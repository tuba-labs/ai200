name: Verify Azure RAG workshop
on:
  pull_request:
    paths: ['workshop/**', 'scripts/**', '.github/workflows/workshop-checks.yml']
  push:
    branches: [main]
    paths: ['workshop/**', 'scripts/**', '.github/workflows/workshop-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-verification:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_USER: workshopadmin
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: products
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U workshopadmin -d products"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/products?sslmode=disable
      TEST_DATABASE_DSN: host=127.0.0.1 port=5432 dbname=products user=workshopadmin password=local-test-only sslmode=disable
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - name: Set application checkout directory
        run: echo "AI200_APPS_DIR=$RUNNER_TEMP/ai200-apps" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v6
        with: {node-version: '22'}
      - name: Clone pinned application repositories
        run: python workshop/tools/repositories.py clone
      - name: Java and real Flyway/pgvector integration
        run: |
          products_dir=$(python workshop/tools/repositories.py path products)
          cd "$products_dir"
          bash mvnw -B test
      - name: Python and browser tooling
        run: |
          python -m pip install -r workshop/requirements-test.txt
          # The hosted image has Chromium's runtime libraries. Avoid invoking
          # apt for optional fonts and depending on its package mirror's DNS.
          python -m playwright install chromium
      - name: Production site and deterministic integration/browser tests
        run: |
          python scripts/build.py
          python scripts/build.py --check
          python -m pytest workshop/tests -q
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/*.test.cjs
      - name: Shell syntax and lint
        run: |
          for file in workshop/scripts/*.sh workshop/commands.sh; do bash -n "$file"; done
          docker run --rm -v "$PWD:/src:ro" -w /src koalaman/shellcheck:v0.11.0 -x -P workshop/scripts workshop/scripts/*.sh workshop/commands.sh
      - name: Bicep and Kubernetes structural validation
        run: |
          az bicep install --version v0.49.2
          for file in workshop/infra/*.bicep; do az bicep build --file "$file" --outfile "$RUNNER_TEMP/$(basename "$file").json"; done
          python workshop/tools/validate_manifests.py
          docker run --rm -v "$PWD:/src:ro" -w /src ghcr.io/yannh/kubeconform:v0.7.0 -strict -summary -kubernetes-version 1.34.0 workshop/.tools/rendered.yaml
      - name: Build both reference containers
        run: |
          docker build --platform linux/amd64 -t products:ci "$(python workshop/tools/repositories.py path products)"
          docker build --platform linux/amd64 -t products-chat:ci "$(python workshop/tools/repositories.py path chat)"
